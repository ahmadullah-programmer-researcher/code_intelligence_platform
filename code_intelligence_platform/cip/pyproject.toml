[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cip-platform"
version = "0.1.0"
description = "An extensible code intelligence and software reliability platform"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
cip = "cip.cli:main"

[tool.setuptools.packages.find]
include = ["cip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
